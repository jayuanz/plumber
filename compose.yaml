services:
  plumber:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      WEBTERM_CWD: /home/plumber
      WEBTERM_SHELL: /bin/bash
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - plumber-home:/home/plumber

volumes:
  plumber-home:
